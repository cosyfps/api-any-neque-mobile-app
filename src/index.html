<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Ñeque</title>
    <!-- App privada y solo móvil: ningún buscador debe indexarla ni archivarla. -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="color-scheme" content="light dark" />
    <!-- Apariencia elegida en Perfil (ThemeService), aplicada antes de pintar
         para que el modo oscuro no arranque con un destello en claro. -->
    <script>
      try {
        var t = localStorage.getItem('neque.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="assets/fonts/Inter-Regular.woff2"
      crossorigin
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
